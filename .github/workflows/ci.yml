name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cires
          POSTGRES_PASSWORD: cires
          POSTGRES_DB: cires_demandes_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cires"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cires:cires@localhost:5432/cires_demandes_ci?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-never-used-outside-ci
      JWT_ACCESS_EXPIRES_IN: 8h
      CORS_ORIGIN: http://localhost:4200
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Unit tests
        run: npm test -- --ci

      - name: Build
        run: npm run build

      - name: e2e tests
        run: npm run test:e2e -- --ci

  frontend:
    name: Frontend (format check, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npx prettier --check "src/**/*.{ts,html,css}"

      - name: Unit tests
        # Le nouveau builder Angular (@angular/build:unit-test, basé sur
        # Vitest) passe automatiquement en mode "single run" quand la
        # variable d'environnement CI est présente (déjà positionnée par
        # GitHub Actions), donc pas besoin d'un flag --watch=false ici.
        run: npm test

      - name: Build
        run: npm run build